<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kerebrom memory flow</title>
  <desc id="desc">A local-first memory flow from the user to an AI client, the Kerebrom MCP server, a local SQLite FTS5 store, and recovered project context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.52" stop-color="#101827"/>
      <stop offset="1" stop-color="#162033"/>
    </linearGradient>
    <linearGradient id="accent" x1="112" y1="60" x2="1088" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.48" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="257" rx="26.5" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M67 204C220 137 347 181 501 107C662 29 820 61 979 101C1052 120 1095 110 1133 84" stroke="url(#accent)" stroke-opacity="0.16" stroke-width="34" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="56" y="72" width="146" height="86" rx="22" fill="#111827" stroke="#334155"/>
    <text x="129" y="107" text-anchor="middle" fill="#E5E7EB" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">You</text>
    <text x="129" y="132" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">intent</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="272" y="72" width="170" height="86" rx="22" fill="#111827" stroke="#334155"/>
    <text x="357" y="107" text-anchor="middle" fill="#E5E7EB" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">AI client</text>
    <text x="357" y="132" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Claude, Codex, Cursor</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="512" y="52" width="190" height="126" rx="26" fill="#111827" stroke="#A7F3D0" stroke-opacity="0.68"/>
    <text x="607" y="99" text-anchor="middle" fill="#ECFDF5" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800">Kerebrom</text>
    <text x="607" y="128" text-anchor="middle" fill="#A7F3D0" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">MCP server</text>
    <text x="607" y="152" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">15 mem_* tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="772" y="72" width="174" height="86" rx="22" fill="#111827" stroke="#334155"/>
    <text x="859" y="107" text-anchor="middle" fill="#E5E7EB" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">SQLite + FTS5</text>
    <text x="859" y="132" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">local store</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1016" y="72" width="154" height="86" rx="22" fill="#111827" stroke="#334155"/>
    <text x="1093" y="107" text-anchor="middle" fill="#E5E7EB" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Context</text>
    <text x="1093" y="132" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">recovered fast</text>
  </g>

  <path d="M210 115H260" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M450 115H500" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M710 115H760" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M954 115H1004" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1088 166C1031 218 743 225 625 184" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow)"/>

  <text x="600" y="226" text-anchor="middle" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">Local-first durable memory, private by default</text>
</svg>
